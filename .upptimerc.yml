# Kvedo statusa lapa (Upptime). Docs: https://upptime.js.org/docs/configuration
owner: RudolfsSuklais
repo: kvedo-status

sites:
  - name: API
    slug: api
    url: https://api.kvedo.com/v1/health
    expectedStatusCodes:
      - 200
    # Down, ja atbildē nav "status":"ok" (piem. DB nestrādā)
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    maxResponseTime: 5000
  - name: Lietotne (app.kvedo.com)
    slug: lietotne
    url: https://app.kvedo.com/
    expectedStatusCodes:
      - 200
  - name: Mājaslapa (kvedo.com)
    slug: majaslapa
    url: https://kvedo.com/
    expectedStatusCodes:
      - 200

# Paziņojumus sūta esošais kvedo-uptime (ntfy), šeit nekādu paziņojumu nav.
assignees: []

status-website:
  # Pielāgots domēns (DNS: status.kvedo.com CNAME rudolfssuklais.github.io)
  cname: status.kvedo.com
  name: Kvedo statuss
  logoUrl: https://kvedo.com/assets/apple-touch-icon.png
  logoHref: https://kvedo.com
  favicon: https://kvedo.com/assets/favicon-32.png
  theme: light
  introTitle: "**Kvedo** sistēmu statuss"
  introMessage: Šeit redzams, vai Kvedo lietotne, API un mājaslapa šobrīd darbojas. Pārbaude notiek ik pēc 5 minūtēm.
  navbar:
    - title: Statuss
      href: /
    - title: kvedo.com
      href: https://kvedo.com

